global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rag-agent"
    static_configs:
      - targets: ["rag-agent:8000"]  # 컨테이너 내부 포트 (호스트 8002 아님)
    metrics_path: /metrics

  - job_name: "gpu-exporter"
    static_configs:
      - targets: ["gpu-exporter:9835"]
