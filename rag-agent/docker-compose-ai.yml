version: '3.8'

services:
  # 1. 임베딩 모델 (BGE-M3)
  bge-m3:
    image: vllm/vllm-openai:latest
    container_name: bge-m3
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    shm_size: '2gb'
    command: >
      --model BAAI/bge-m3 --dtype auto --gpu-memory-utilization 0.12 --max-model-len 8192 --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - ai-net

  # 2. LLM 모델 (Qwen3)
  qwen3:
    image: vllm/vllm-openai:latest
    container_name: qwen3
    depends_on:
      bge-m3:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    ports:
      - "8001:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=1
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --model pkun2/qwen3_4bit_mixed_kr_2_gptq --gpu-memory-utilization 0.7 --max-model-len 8192 --enable-auto-tool-choice --tool-call-parser hermes
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ai-net

  # 3. RAG 에이전트 (FastAPI + LangGraph)
  rag-agent:
    build: .
    container_name: rag-agent
    ports:
      - "8002:8000"
    environment:
      # AI PC 내부 통신
      - EMBEDDING_API_URL=http://bge-m3:8000/v1
      - LLM_API_URL=http://qwen3:8000/v1

      # Main PC (Kafka) 연결: .env 파일에서 MAIN_PC_IP를 설정해야 함
      - KAFKA_BOOTSTRAP_SERVERS=${MAIN_PC_IP}:29092
    depends_on:
      bge-m3:
        condition: service_healthy
      qwen3:
        condition: service_healthy
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge
