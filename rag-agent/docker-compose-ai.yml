services:
  bge-m3:
    image: vllm/vllm-openai:latest
    container_name: bge-m3
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    ipc: host
    shm_size: '2gb'
    command: >
      --model BAAI/bge-m3 --dtype auto --gpu-memory-utilization 0.12 --max-model-len 8192 --trust-remote-code
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - ai-net
  qwen3-9b-4bit:
    image: vllm/vllm-openai:cu130-nightly
    container_name: qwen3-9b-4bit
    depends_on:
      bge-m3:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    ports:
      - "8001:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro # WSL CUDA 라이브러리
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=1
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib # WSL CUDA 라이브러리 경로
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HUB_ENABLE_HF_TRANSFER=1
    command: >
      --model pkun2/qwen3_4bit_mixed_kr_2_gptq
      --gpu-memory-utilization 0.7
      --max-model-len 8192
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ai-net
  rag-agent:
    build: .
    container_name: rag-agent
    ports:
      - "8002:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    working_dir: /app
    environment:
      - PERSIST_DIRECTORY=/app/chroma_db
      - EMBEDDING_API_URL=http://bge-m3:8000/v1
      - LLM_API_URL=http://qwen3-9b-4bit:8000/v1
      - KAFKA_BOOTSTRAP_SERVERS=kafka-kraft:9092
      - POLL_SERVICE_URL=poll-service:8082
    extra_hosts:
      - "host.docker.internal:${MAIN_PC_IP}"
    depends_on:
      bge-m3:
        condition: service_healthy
      qwen3-9b-4bit:
        condition: service_healthy
    networks:
      - ai-net
      - everypoll-net
    command: python rag_agent.py
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1
    container_name: gpu-exporter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    ports:
      - "9835:9835"
    restart: always
    networks:
      - ai-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9091:9090"
    networks:
      - ai-net
    restart: unless-stopped
    depends_on:
      - rag-agent

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ai-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  ai-net:
    driver: bridge
  everypoll-net:
    external: true
    name: everypoll-msa_everypoll-net

volumes:
  prometheus_data:
  grafana_data:
